name: Publish release
on:
  push:
    branches: [main]
    paths: ['Resources/Info.plist', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'TakimotoUki/Codex-Model-Lens' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Offline tests
        run: ./Scripts/test.sh
      - name: Build arm64 application
        run: ./Scripts/build_release.sh
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ARCHIVE="Codex-Model-Lens-$VERSION-arm64.zip"
          (cd Distribution && shasum -a 256 "$ARCHIVE" > SHA256SUMS.txt)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists; preserved."
            exit 0
          fi
          python3 - "$VERSION" <<'PY'
          import re, sys
          from pathlib import Path
          version = sys.argv[1]
          text = Path('Documentation/CHANGELOG.md').read_text()
          section = re.search(r'^## ' + re.escape(version) + r'[^\n]*\n(.*?)(?=^## |\Z)', text, re.M | re.S)
          if not section:
              raise SystemExit('Missing release notes')
          Path('Distribution/release-notes.md').write_text(section.group(1).strip() + '\n\nmacOS 26+ · Apple Silicon. Ad-hoc signed; not notarized. Model reports describe their own request and do not establish server weights.\n')
          PY
          gh release create "v$VERSION" "Distribution/$ARCHIVE" Distribution/SHA256SUMS.txt \
            --target "$RELEASE_COMMIT" --title "Codex Model Lens $VERSION" \
            --notes-file Distribution/release-notes.md
